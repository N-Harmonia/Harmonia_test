[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "georl"
version = "0.1.0"
description = "Adaptive visual tokenization via PPO for remote-sensing vision foundation models."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "GeoRL Authors"},
]
keywords = ["remote-sensing", "vision-transformer", "reinforcement-learning", "ppo", "tokenization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
georl = ["py.typed"]

[project.scripts]
georl-train = "georl.cli.train:main"
georl-eval = "georl.cli.eval:main"
georl-infer = "georl.cli.infer:main"
georl-export = "georl.cli.export_onnx:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["assets", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF", "SIM"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "B008", "E731", "B007", "B018", "PLW0603", "E501", "RUF013", "RUF005", "PLW2901", "SIM108", "SIM102", "SIM105", "SIM103", "UP007", "RUF012", "B028", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]
"src/georl/cli/*" = ["PLC0415"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["georl"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
namespace_packages = true
mypy_path = "src"
explicit_package_bases = true
plugins = []
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = [
    "einops.*",
    "fvcore.*",
    "timm.*",
    "torchvision.*",
    "cv2.*",
    "shapely.*",
    "pycocotools.*",
    "hydra.*",
    "omegaconf.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "shape: tensor-shape contract",
    "unit: pure unit test",
    "integration: multi-module integration",
    "regression: numeric regression vs paper table",
    "overfit: overfit-single-batch sanity",
    "smoke: tiny end-to-end smoke run",
    "slow: skipped in CI",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
]
