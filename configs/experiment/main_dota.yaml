name: main_dota
optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip: 0.5
scheduler:
  name: cosine
  warmup_steps: 500
  total_steps: 50000
  min_lr_factor: 0.01
reward:
  alpha: 1.0
  beta: 0.3
  lam: 0.1
  n_max: 16
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  ppo_epochs: 4
  minibatch_size: 256
model:
  state_encoder_dim: 256
  transformer_blocks: 4
  transformer_heads: 4
  transformer_ffn: 1024
  transformer_dropout: 0.1
  base_patch: 16
  num_regions: 1024
  image_size: 512
  vfm: vit_l14
  num_classes: 15
  head: detection
  in_channels: 3
data:
  name: dota
  root: data/dota
  split: train
  num_workers: 4
  batch_size: 8
  image_size: 512
  extra: {}
train:
  epochs: 50
  iterations_per_epoch: 1000
  seed: 42
  amp: true
  grad_accum: 1
  log_interval: 50
  eval_interval: 1000
  ckpt_dir: ckpts
  ckpt_keep_last: 3
  ema_decay: 0.0
  deterministic: false
